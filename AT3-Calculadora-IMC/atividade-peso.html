<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>
</head>

<body>

    <h1 style="color: blue;">Calculo de IMC - Somente para Adultos</h1>

    <h3>Insira sua Altura (m):</h3>
    <input id="altura" type="number" placeholder="Ex: 1.75 ou 175">

    <h3>Insira seu Peso (kg):</h3>
    <input id="peso" type="number" placeholder="Ex: 70">
    <p></p>

    <button type="button" onclick="calcular()">CALCULAR</button>
    <h4 id="mensagem"></h4>

    <script>

        function calcular() {
            
            var altura = document.getElementById("altura").value;
            var peso = document.getElementById("peso").value;
            var texto, imc;
        
            if (altura > 10) {
                altura /= 100;
            }

            imc = peso / (altura * altura);

            if (altura && peso) {
                if (imc < 18.5) {
                    texto = "Baixo Peso";
                } else if (imc >= 18.5 && imc < 25) {
                    texto = "Peso Normal";
                } else if (imc >= 25 && imc < 30) {
                    texto = "Sobrepeso";
                } else if (imc >= 30 && imc < 35) {
                    texto = "Obesidade Grau I";
                } else if (imc >= 35 && imc < 40) {
                    texto = "Obesidade Grau II";
                } else {
                    texto = "Obesidade Morbida";
                }

                document.getElementById("mensagem").innerHTML = texto + "<br><br>IMC: " + imc.toFixed(2) + " kg/m²";
            } else {
                texto = "Campo Vazio";
                document.getElementById("mensagem").innerHTML = texto;
            }

        }

    </script>

</body>

</html>
